source: >-
  Deprecated flags read from openapi/agriinfodesign-datastore-openapi.yml,
  openapi/agriinfodesign-pay-openapi.yml and openapi/agriinfodesign-manager-swagger.json; versioning
  read from the path structure of all four contracts; status-page and changelog absence established
  by live probes on 2026-09-12.
versioning:
  style: uri-path
  detail: >-
    Every service versions in the URI path. auth, datastore and pay use /v1/...; the AgriBus-Web
    Manager API runs /v1/ and /v2/ side by side, with v2 controllers (StripeV2, CasterV2,
    WebMarkerV2) shipped alongside the v1 originals rather than replacing them. The datastore
    additionally carries a /poc/ prefix for a deprecated proof-of-concept of the agricultural
    machinery Open API, and an underscore-prefixed /v1/_connect/ and /v1/_errors/ namespace for
    internal admin and data-repair routes that are nonetheless published in the public contract.
  current_versions:
    auth: v1
    datastore: v1 (plus a deprecated /poc surface)
    manager: v1 and v2
    pay: v1
  domain_standard_version: >-
    The datastore contract tags its agricultural-machinery surface "農機オープンAPI v2.0.0"
    (Agricultural Machinery Open API v2.0.0) - a version of the Japanese cross-vendor standard, not
    of Agri Info Design's own API.
deprecation_policy:
  published: false
  detail: >-
    No deprecation or sunset policy is published anywhere on agri-info-design.com, in the Zendesk
    help centre, or in any contract. Thirteen operations are flagged deprecated: true in the specs,
    but none carries a sunset date, a replacement pointer, or an explanatory description, and a live
    call to a deprecated path returns no Deprecation or Sunset header (RFC 8594).
  rfc8594_headers: false
  deprecated_operation_count: 13
