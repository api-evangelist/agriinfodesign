note: >-
  AGRI INFO DESIGN SHIPS NO MCP SERVER. `mode: none` is the finding, not a placeholder. The tool list
  below is a CANDIDATE derived by API Evangelist from the provider's own published OpenAPI
  operations - it describes what an MCP server over this platform could expose, and nothing in it
  should be read as something the provider offers today. No endpoint URL is guessed here, because a
  guessed path that happened to answer would read as a verified agent surface.
why_this_is_a_plausible_candidate: >-
  The read surface is unusually well suited to an agent: fields, reference lines, work records,
  plantings and machine location history are all small, well-named, geospatially indexed resources,
  the location endpoint already returns RFC 7946 GeoJSON, and the platform already operates an OAuth
  2.0 authorization surface with a published ten-scope catalogue governing exactly these resources
  (noki.devices.*, noki.locations.*, noki.work-records.*, noki.field-boundaries.*,
  noki.environmental-data.*). The authorization model an MCP server would need already exists.
blockers:
  - >-
    No operation in any contract declares a non-200 response, so a tool built from these specs has
    no defined failure semantics.
  - >-
    No idempotency mechanism, so every write tool would be unsafe to retry
    (see conventions/agriinfodesign-conventions.yml).
  - >-
    No rate-limit signal, so an agent has no backpressure
    (see rate-limits/agriinfodesign-rate-limits.yml).
  - >-
    No documented client registration for the OAuth surface, so a third-party agent has no way to
    obtain credentials.
