spec_hygiene_findings:
  - finding: invalid-format-values
    detail: >-
      Every timestamp property in the datastore contract declares
      `"format": "2016-01-01T00:00:00.000Z"` - an example value written into the `format` keyword
      instead of `date-time`. A code generator reading these schemas produces string fields with an
      unrecognised format across the whole model.
    evidence: components.schemas.RemoteFieldItem.properties.createdDateTime.format
  - finding: framework-internals-leaked-into-the-contract
    detail: >-
      The auth contract publishes 36 schemas, of which at least 13 are Spring/Servlet framework
      internals rather than domain objects - ApplicationContext, AutowireCapableBeanFactory,
      BeanFactory, Environment, FilterRegistration, JspConfigDescriptor, JspPropertyGroupDescriptor,
      ServletContext, ServletRegistration, SessionCookieConfig, TaglibDescriptor, RedirectView,
      HttpStatusCode. They are reachable from the OAuth authorize operation's return type and are
      not part of the API.
    evidence: openapi/agriinfodesign-auth-openapi.yml components.schemas
  - finding: duplicate-list-routes
    detail: >-
      /v1/field_items and /v1/field_items/, /v1/plantings and /v1/plantings/, /v1/ref_line_items and
      /v1/ref_line_items/ are each published twice with different operationIds
      (listAllFieldItems_1, list_1, listRefLines_1).
  - finding: internal-operations-published
    detail: >-
      The /v1/_errors/duplication/ data-repair namespace (including a test sub-namespace that copies
      data from RDS to Firestore) and /v1/_connect/admin/ are in the public contract. They are
      tagged ErrorsDuplicationForTest and V1ConnectAdmin and are almost certainly not intended as
      integration surface.
