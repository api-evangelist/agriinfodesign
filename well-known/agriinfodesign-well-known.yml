source: >-
  Anonymous HTTPS probes of /.well-known/* and /llms.txt against every host the record knows:
  the registrable domain (agri-info-design.com), the AgriBus-Web console host
  (app.agribus-connect.com), every OpenAPI servers[] host on agribus-connect.net
  (auth, datastore, manager, pay), the Shopify storefront (shop.agri-info-design.com)
  and the Zendesk help centre (support.agri-info-design.com).
note: >-
  Agri Info Design serves a real OpenID Connect discovery document and a JWKS from its AgriBus
  authentication service, but at the NON-STANDARD path /.well-known/openid_configuration
  (underscore). A conformant OIDC client probing the RFC 8414 / OpenID Discovery path
  /.well-known/openid-configuration (hyphen) receives HTTP 404 on the same host, so the document
  is effectively undiscoverable to standards-compliant tooling. The hyphenated path is recorded
  below as a 404 alongside the underscore path that answers 200, because both facts matter.
  The discovery document it does serve advertises manager-development.agribus-connect.net as its
  issuer, authorization, token, userinfo and jwks_uri host - a development environment - which is
  recorded verbatim and is discussed in conformance/ and lifecycle/.
  app.agribus-connect.com is a Vue single-page app whose server answers HTTP 200 with the same
  1,287-byte HTML shell for every /.well-known/* path; those are recorded as misses, not hits.
  The two documents served from shop.agri-info-design.com are generated by the Shopify platform
  (Shopify customer-account OIDC, and a Shopify-authored llms.txt advertising the shop.app agent
  skill), not authored by Agri Info Design - they are saved and indexed because the company serves
  them from a host it controls, but they say nothing about its own API program.
