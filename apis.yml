apis:
  - name: AgriBus Datastore API
    description: >-
      Field, reference-line, work-record, planting, observation and elevation-map datastore behind
      AgriBus-NAVI and AgriBus-Web, plus Agri Info Design's implementation of the Japanese
      農機オープンAPI (Agricultural Machinery Open API v2.0.0) device and location surface, which
      returns machine position history as a GeoJSON FeatureCollection. 50 paths / 61 operations.
      Bearer JWT. The OpenAPI is served anonymously by springdoc at /v3/api-docs; the Swagger UI
      on the same host is authenticated (HTTP 401).
    humanURL: https://agri-info-design.com/en/agribus-web/
    baseURL: https://datastore.agribus-connect.net
    tags:
      - Agriculture
      - Precision Agriculture
      - Farm Management
      - Agricultural Machinery
      - Geospatial
      - GNSS
    tags_raw:
      - agriculture
      - precision-agriculture
      - farm-management
      - agricultural-machinery
      - geospatial
      - gnss
    properties:
      - type: OpenAPI
        url: openapi/agriinfodesign-datastore-openapi.yml
      - type: Overlay
        url: overlays/agriinfodesign-datastore-overlay.yaml
      - type: DataModel
        url: data-model/agriinfodesign-data-model.yml
      - type: ErrorCatalog
        url: errors/agriinfodesign-problem-types.yml
  - name: AgriBus Authentication & OpenID Connect API
    description: >-
      Identity service for the AgriBus platform - sign-up, sign-in, password reset, user profile and
      icon, group membership, Firebase custom tokens, RTK caster settings, impersonation for system
      admins, and an OAuth 2.0 / OpenID Connect authorization surface with a published scope
      catalogue for the agricultural-machinery Open API. 20 paths / 22 operations. Bearer JWT.
      Serves OIDC discovery at the non-standard path /.well-known/openid_configuration and a JWKS
      at /.well-known/jwks.json.
    humanURL: https://agri-info-design.com/en/agribus-web/
    baseURL: https://auth.agribus-connect.net
    tags:
      - Agriculture
      - Authentication
      - OAuth
      - OpenID Connect
      - RTK
    tags_raw:
      - agriculture
      - authentication
      - oauth
      - openid-connect
      - rtk
    properties:
      - type: OpenAPI
        url: openapi/agriinfodesign-auth-openapi.yml
      - type: Overlay
        url: overlays/agriinfodesign-auth-overlay.yaml
      - type: OpenIDConnect
        url: https://auth.agribus-connect.net/.well-known/openid_configuration
      - type: Authentication
        url: authentication/agriinfodesign-authentication.yml
      - type: OAuthScopes
        url: scopes/agriinfodesign-scopes.yml
  - name: AgriBus-Web Manager API
    description: >-
      The AgriBus-Web Manager API - devices, users, tokens, teams/groups, web markers, search,
      system administration, RTK caster (base/rover) management and Stripe billing controllers,
      in v1 and v2 generations. 71 paths. Described by a Swagger 2.0 document served anonymously
      by Springfox at /v2/api-docs, listed in /swagger-resources as "AgriBus-Web API"; its
      info.termsOfService and license both point at agri-info-design.com.
    humanURL: https://agri-info-design.com/en/agribus-web/
    baseURL: https://manager.agribus-connect.net
    tags:
      - Agriculture
      - Farm Management
      - RTK
      - Telematics
    tags_raw:
      - agriculture
      - farm-management
      - rtk
      - telematics
    properties:
      - type: Swagger
        url: openapi/agriinfodesign-manager-swagger.json
      - type: OpenAPI
        url: openapi/agriinfodesign-manager-swagger.json
      - type: Overlay
        url: overlays/agriinfodesign-manager-overlay.yaml
  - name: AgriBus Billing & Payments API
    description: >-
      Subscription and purchase service for the AgriBus paid plans - Stripe cards, coupons,
      invoices, upcoming invoices, plans, subscriptions and payment-method changes, Google Play
      real-time developer notifications and Android purchase verification, AgriBus-NAVI purchase
      status, and AgriBus-DWH market-monitor access tokens. 21 paths / 22 operations. Bearer JWT.
      OpenAPI served anonymously at /v3/api-docs.
    humanURL: https://agri-info-design.com/paidplans/
    baseURL: https://pay.agribus-connect.net
    tags:
      - Agriculture
      - Billing
      - Payments
      - Subscriptions
    tags_raw:
