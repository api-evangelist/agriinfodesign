aid: agriinfodesign
name: Agri Info Design
description: >-
  Agri Info Design, Ltd. (株式会社農業情報設計社) is a Japanese agricultural-technology company founded
  21 April 2014 in Obihiro, Hokkaido, building precision-farming guidance for tractors and other
  agricultural machinery. Its AgriBus product line pairs the AgriBus-NAVI Android GPS/GNSS guidance
  app (100,000+ downloads worldwide) with AgriBus-GMiniR and AgriBus-G2 RTK-GNSS receivers, the
  AgriBus-AutoSteer automatic steering package, and AgriBus-Web, a browser console for field
  boundaries, reference lines, work-record history, elevation maps and RTK base-station management.
  The company also sells ISOBUS / ISO 11783 / AG-PORT consulting. Its cloud platform is a set of
  Spring Boot microservices on agribus-connect.net, each of which publishes a machine-readable
  OpenAPI/Swagger contract anonymously, including an implementation of Japan's NARO-led
  農機オープンAPI (Agricultural Machinery Open API) device and location surface.
url: https://raw.githubusercontent.com/api-evangelist/agriinfodesign/refs/heads/main/apis.yml
image: https://agri-info-design.com/wp-content/uploads/2019/05/AID-logo_sq-06.png
x-type: company
x-source: harvest:secondary-market
