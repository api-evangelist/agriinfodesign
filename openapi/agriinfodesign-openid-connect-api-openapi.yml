          type: array
          items:
            $ref: '#/components/schemas/JspPropertyGroupDescriptor'
        taglibs:
          type: array
          items:
            $ref: '#/components/schemas/TaglibDescriptor'
    AuthorizeRequest:
      required:
      - clientId
      - responseType
      type: object
      properties:
        responseType:
          type: string
          description: Response type
          example: code
        clientId:
          type: string
          description: Client identifier
        redirectUri:
          type: string
          description: Redirection URI
        scope:
          type: string
          description: Scope of access request
          example: openid profile email
        state:
          type: string
          description: State parameter for CSRF protection
        nonce:
          type: string
          description: Nonce for ID Token security (OpenID Connect)
        codeChallenge:
          type: string
          description: Code challenge for PKCE
        codeChallengeMethod:
          type: string
          description: Code challenge method for PKCE
          example: S256
    OpenIdConfigurationResponse:
      type: object
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        jwks_uri:
          type: string
        response_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        claims_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        claim_types_supported:
          type: array
          items:
            type: string
    TaglibDescriptor:
      type: object
      properties:
        taglibURI:
          type: string
        taglibLocation:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
