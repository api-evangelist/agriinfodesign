openapi: 3.2.0
info:
  title: Agriinfodesign OpenID Connect API
  description: OpenID Connect Discovery and endpoints
servers:
- url: http://auth.agribus-connect.net
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: OpenID Connect
  description: OpenID Connect Discovery and endpoints
paths:
  /v1/oidc/userinfo:
    get:
      tags:
      - OpenID Connect
      summary: OpenID Connect UserInfo
      description: Returns user claims for the authenticated user
      operationId: userInfo
      parameters:
      - name: Authorization
        in: header
        description: Bearer access token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
      security:
      - bearerAuth: []
  /v1/oauth/authorize:
    get:
      tags:
      - OpenID Connect
      summary: OAuth2/OpenID Connect Authorization
      description: OAuth2 Authorization Code Grant and OpenID Connect Authentication Request
      operationId: authorize
      parameters:
      - name: request
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RedirectView'
  /.well-known/openid_configuration:
    get:
      tags:
      - OpenID Connect
      summary: OpenID Connect Discovery
      description: Returns OpenID Connect provider configuration metadata
      operationId: openidConfiguration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIdConfigurationResponse'
  /.well-known/jwks.json:
    get:
      tags:
      - OpenID Connect
      summary: JSON Web Key Set
      description: Returns public keys used for JWT signature verification
      operationId: jwks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
